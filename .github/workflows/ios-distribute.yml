name: iOS 빌드 & App Distribution

# 수동 실행 전용 (GitHub 웹/모바일 앱 Actions 탭 > Run workflow)
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "App Distribution 테스터 그룹 (쉼표 구분)"
        default: "testers"
      notes:
        description: "릴리즈 노트"
        default: ""

env:
  TEAM_ID: X8P2QKDF7W
  BUNDLE_ID: com.bull.parrokit

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env 는 커밋되지 않지만 pubspec assets 에 포함되어 있어 빌드에 필요
      - name: .env 생성
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: 인증서/프로비저닝 프로파일 설치
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "${{ secrets.IOS_CERT_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "${{ secrets.IOS_CERT_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      # 프로젝트는 CocoaPods 기반(Podfile.lock에 wkwebview 포함). 최신 Flutter의
      # 기본값인 SwiftPM이 켜져 있으면 plugin이 Pod 목록에서 빠져 pod install이 실패한다.
      - name: SwiftPM 비활성화 (CocoaPods 사용)
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      # Xcode 빌드 단계가 `flutterfire upload-crashlytics-symbols`를 호출하므로 CLI 필요
      - name: FlutterFire CLI 설치
        run: |
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # 컴파일은 아래 Archive 단계에서 한 번만 한다 (설정 생성 + pod install만 수행)
      - name: iOS 설정 생성 및 pod install
        run: flutter build ios --release --no-codesign --config-only

      - name: Archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: IPA export (Ad Hoc)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Firebase App Distribution 업로드
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:392832464036:ios:71b3e2d9c65fa1922e6231
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ inputs.groups }}
          releaseNotes: ${{ inputs.notes }}
          file: ${{ runner.temp }}/export/Runner.ipa
