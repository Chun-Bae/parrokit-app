name: parrokit
description: "Parrokit: 애니메이션 클립으로 즐기는 언어 학습 앱"
# Private Project - Do not publish to pub.dev
publish_to: 'none'

# iOS 빌드 번호 업데이트
# flutter build ios --config-only
version: 1.0.6+98

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # -----------------------------------------------------------
  # UI & Design System
  # -----------------------------------------------------------
  cupertino_icons: ^1.0.8     # iOS 스타일 아이콘
  flutter_svg: ^2.2.3         # SVG 이미지 렌더링
  google_fonts: ^6.1.0        # (Optional) 폰트 로드

  # -----------------------------------------------------------
  # State Management & Routing
  # -----------------------------------------------------------
  provider: ^6.1.5+1          # 전역 상태 관리
  go_router: ^16.1.0          # 라우팅 (네비게이션)

  # -----------------------------------------------------------
  # Firebase & Cloud
  # -----------------------------------------------------------
  firebase_core: ^4.2.1       # Firebase 코어
  firebase_auth: ^6.1.2       # 이메일/소셜 인증
  cloud_firestore: ^6.1.0     # 클라우드 데이터베이스
  firebase_messaging: ^16.0.2 # 푸시 알림 수신
  firebase_crashlytics: ^5.0.5 # 크래시 자동 수집
  device_info_plus: ^10.1.0   # 기기 식별자 (IDFV/Android ID)

  # -----------------------------------------------------------
  # Local Storage & Database
  # -----------------------------------------------------------
  shared_preferences: ^2.5.3  # 간단한 키-값 저장 (설정 등)
  drift: ^2.28.1              # 로컬 SQLite 데이터베이스 (ORM)
  sqlite3_flutter_libs: ^0.5.39 # SQLite 네이티브 라이브러리

  # -----------------------------------------------------------
  # Media (Video, Audio, Image)
  # -----------------------------------------------------------
  video_player: ^2.10.0       # 비디오 재생
  video_thumbnail: ^0.5.6     # 비디오 썸네일 추출
  just_audio: ^0.10.5         # 오디오 재생 (BGM, 효과음)
  audio_waveforms: ^2.0.2     # 실제 오디오 파형 추출·시각화
  audio_service: ^0.18.18     # 백그라운드 오디오 제어
  audio_session: ^0.2.2       # 오디오 세션 관리
  image_picker: ^1.2.0        # 갤러리/카메라 이미지 선택

  # iOS 18 용, But Android 빌드 안됨 (V1 Embedding 문제)
  # ffmpeg_kit_flutter:         # FFmpeg (영상 편집/변환)
  #   git:
  #     url: https://github.com/Sahad2701/ffmpeg-kit.git
  #     path: flutter/flutter
  #     ref: flutter_fix_retired_v6.0.3
 
  # iOS 17 + Android 호환, iOS 18에서는 파일 피커시 프리징 현상
  ffmpeg_kit_flutter_new: ^4.1.0
  
  # -----------------------------------------------------------
  # Network & Utilities
  # -----------------------------------------------------------
  http: ^1.5.0                # HTTP 요청
  dio: ^5.9.0                 # 강력한 HTTP 클라이언트
  flutter_dotenv: ^6.0.0      # 환경 변수 (.env) 관리
  url_launcher: ^6.3.2        # URL 열기 (브라우저 등)
  flutter_inappwebview: ^6.1.5    # 인앱 브라우저
  web_socket_channel: ^3.0.1  # 웹소켓 통신 (필요 시)
  flutter_email_sender: ^7.0.0 # 이메일 앱 호출
 
  # -----------------------------------------------------------
  # File Management
  # -----------------------------------------------------------
  path_provider: ^2.1.5       # 디바이스 경로 획득
  path: ^1.9.0                # 경로 조작 유틸리티
  file_picker: ^10.1.5         # 파일 선택기
  file_saver: ^0.2.14         # 파일 저장
  flutter_file_dialog: ^3.0.2 # 시스템 파일 대화상자
  archive: ^4.0.7             # 압축/해제 (ZIP 등)
  mime: ^2.0.0                # MIME 타입 확인

  # -----------------------------------------------------------
  # Monetization (Ads & Payment)
  # -----------------------------------------------------------
  google_mobile_ads: ^6.0.0   # 구글 애드몹 (광고)
  in_app_purchase: ^3.2.3     # 인앱 결제 (IAP)
  # -----------------------------------------------------------
  # Utils & Helpers
  # -----------------------------------------------------------
  uuid: ^4.5.1                # 고유 ID 생성
  intl: ^0.20.2               # 날짜/숫자 포맷팅, 다국어
  logger: ^2.6.0              # 로깅 유틸리티
  crypto: ^3.0.6              # 암호화/해싱
  share_plus: ^12.0.0         # 콘텐츠 공유
  restart_app: ^1.3.2         # 앱 재실행 기능
  http_parser: ^4.1.2         # HTTP 헤더 파싱
  purchases_flutter: ^9.14.0
  purchases_ui_flutter: ^9.14.0
  advertising_id: ^2.7.1
  google_sign_in: ^6.2.1
  kakao_flutter_sdk: ^2.0.0+1
  cloud_functions: ^6.2.0
  flutter_naver_login: ^2.1.1
  sign_in_with_apple: ^7.0.1
  firebase_storage: ^13.4.1
  flutter_markdown: ^0.7.7+1
  markdown: ^7.2.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_mlkit_language_id: ^0.13.1
  google_mlkit_commons: ^0.11.1
  package_info_plus: ^8.1.2   # 앱 버전/빌드번호 런타임 조회

# -----------------------------------------------------------
# Dependency Overrides
# -----------------------------------------------------------
dependency_overrides:
  path_provider_foundation: 2.4.4  # 2.6.0+는 objective_c.framework 필요 (iOS 18+)
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0       # 린트 규칙
  drift_dev: ^2.28.0          # Drift 코드 생성기
  build_runner: ^2.4.15       # 코드 생성 러너
  flutter_launcher_icons: ^0.14.4 # 앱 아이콘 생성
  flutter_native_splash: ^2.4.4   # 스플래시 스크린 생성
  mockito: ^5.6.4
  fake_cloud_firestore: ^4.1.1


# -----------------------------------------------------------
# Flutter Configuration
# -----------------------------------------------------------
flutter:
  uses-material-design: true

  # Assets (이미지, 로고, 데이터 파일 등)
  assets:
    - .env
    - assets/logos/pa_logo.png
    - assets/icons/
    - assets/intros/
    - assets/prompts/

  # Custom Fonts (IBM Plex Sans KR)
  fonts:
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR/IBMPlexSansKR-Bold.ttf
          weight: 700

# -----------------------------------------------------------
# Tool Configurations
# -----------------------------------------------------------

# 앱 아이콘 설정
flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/icons/pa_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/pa_icon.png"

# 스플래시 스크린 설정
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  color_dark: "#0D0F12"
  image: assets/splash/pa_splash.png
  image_dark: assets/splash/pa_splash_dark.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/splash/pa_splash_android12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0D0F12"
