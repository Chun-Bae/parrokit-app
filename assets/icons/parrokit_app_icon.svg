<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Parrokit app icon</title>
  <desc id="desc">A minimal layered parrot head mark in white, ice blue, and navy on an electric blue gradient.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="1024" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071D8E"/>
      <stop offset="0.48" stop-color="#073DDA"/>
      <stop offset="1" stop-color="#1786FF"/>
    </linearGradient>
    <radialGradient id="backgroundLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(522 310) rotate(90) scale(650)">
      <stop stop-color="#3FA5FF" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#1263F3" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07167D" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="whiteLayer" x1="302" y1="196" x2="676" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DEECFF"/>
    </linearGradient>
    <linearGradient id="iceLayer" x1="350" y1="568" x2="574" y2="837" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CDE8FF"/>
      <stop offset="0.55" stop-color="#A8D4FF"/>
      <stop offset="1" stop-color="#E6F4FF"/>
    </linearGradient>
    <linearGradient id="beakLayer" x1="626" y1="414" x2="808" y2="704" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122A72"/>
      <stop offset="0.5" stop-color="#081D5B"/>
      <stop offset="1" stop-color="#03113C"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#031A73" flood-opacity="0.18"/>
    </filter>
    <filter id="overlapShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#061B67" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#backgroundLight)"/>

  <!-- The entire head and crest are one uninterrupted, grid-balanced curve. -->
  <path
    d="M258 176
       C330 250 416 282 512 270
       C638 254 748 300 806 390
       C846 452 857 521 835 588
       C818 640 784 687 734 726
       C747 670 735 623 699 590
       C665 559 616 547 557 554
       C487 563 421 593 364 642
       C314 685 279 735 258 793
       C213 723 193 645 202 561
       C212 467 255 391 331 331
       C284 293 259 241 258 176 Z"
    fill="url(#whiteLayer)"
    filter="url(#markShadow)"/>

  <!-- A pale paper/glass layer turns the lower silhouette into a second clean plane. -->
  <path
    d="M258 793
       C279 714 326 649 398 600
       C463 556 532 535 602 538
       C552 584 522 633 513 685
       C503 744 522 796 574 839
       C450 829 342 813 258 793 Z"
    fill="url(#iceLayer)"
    filter="url(#overlapShadow)"/>

  <!-- The single navy accent forms a compact, unmistakably hooked parrot beak. -->
  <path
    d="M626 421
       C698 401 768 416 812 462
       C847 499 858 546 845 592
       C833 637 803 679 754 715
       C768 663 756 620 722 591
       C692 565 650 553 598 557
       C629 513 647 468 626 421 Z"
    fill="url(#beakLayer)"
    filter="url(#overlapShadow)"/>

  <!-- Restrained upper-edge highlights, clipped to the existing geometry. -->
  <path d="M270 197 C342 260 422 287 512 276 C634 261 739 303 796 390" fill="none" stroke="url(#edgeHighlight)" stroke-width="4" stroke-linecap="round" opacity="0.56"/>
  <path d="M272 782 C297 706 342 647 405 606 C463 568 525 547 586 545" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
</svg>
